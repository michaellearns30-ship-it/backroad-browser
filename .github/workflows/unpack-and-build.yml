name: unpack-and-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode, verify, extract
        run: |
          set -euo pipefail
          cat backroad-source/part-*.b64 | base64 -d > /tmp/backroad.tar.gz
          echo "2d4b5782b6f63642521edeaca782bf1bd78833d5561e3b9bb6044a6f2b75df0b  /tmp/backroad.tar.gz" | sha256sum -c -
          tar tzf /tmp/backroad.tar.gz | wc -l
          tar xzf /tmp/backroad.tar.gz -C . --skip-old-files
          ls android/app/src/main/java/dev/backroad/browser/

      - name: Commit the real tree
        run: |
          set -euo pipefail
          git config user.name unpack
          git config user.email unpack@users.noreply.github.com
          git add -A -- . '!:.github'
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Unpack the source tree from backroad-source (sha256 verified)"
          git push

  build:
    needs: unpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        run: gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: backroad-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
