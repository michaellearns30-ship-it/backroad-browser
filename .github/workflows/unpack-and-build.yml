name: unpack-and-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode, verify, extract
        run: |
          set -euo pipefail
          cat backroad-source/part-*.b64 | base64 -d > /tmp/backroad.tar.gz
          echo "2d4b5782b6f63642521edeaca782bf1bd78833d5561e3b9bb6044a6f2b75df0b  /tmp/backroad.tar.gz" | sha256sum -c -
          tar tzf /tmp/backroad.tar.gz | wc -l
          tar xzf /tmp/backroad.tar.gz -C . --skip-old-files
          ls android/app/src/main/java/dev/backroad/browser/

      # The archive cannot be edited from here, so the one compile error it carries is
      # patched on the way out and committed with the rest of the tree. Idempotent: on a
      # repo that already has the fix this does nothing. When the archive is next
      # regenerated, fix this line in the source instead and delete this step.
      - name: Patch the known compile error
        run: |
          set -euo pipefail
          F=android/app/src/main/java/dev/backroad/browser/MainActivity.kt
          sed -i 's/^\( *\)singleLine = true$/\1setSingleLine()/' "$F"
          if grep -q 'singleLine = true' "$F"; then echo "patch did not apply"; exit 1; fi
          grep -n 'setSingleLine()' "$F"

      - name: Commit the real tree
        run: |
          set -euo pipefail
          git config user.name unpack
          git config user.email unpack@users.noreply.github.com
          git add -A -- .
          git reset -q -- .github
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Unpack the source tree from backroad-source (sha256 verified)"
          git push

  build:
    needs: unpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK, from the runner image (no setup action, no licence prompt)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"; fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        run: gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: backroad-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
